version: 2

sources:
  - name: raw
    description: >
      Multi-source raw data landed into Snowflake BRONZE by
      scripts/land_raw_to_snowflake.py. Four sources: Careerjet (API),
      Tanqeeb (scraper), Jooble (API), Techmap (static sample via RapidAPI).
      No transformations applied — raw_payload is stored as VARIANT for
      direct path-syntax access. Each source's staging model filters by
      source_name and extracts its own field paths from raw_payload.
    database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
    schema: BRONZE
    tables:
      - name: raw_jobs
        description: >
          One row per collected job posting from any source.
          raw_payload structure varies by source_name:
            careerjet — keys: title, company, locations, description, salary, url, date, site
            tanqeeb   — keys: job_title, company, city, country, job_description, salary, posting_date, scraped_at
            jooble    — keys: title, company, location, snippet, salary, updated, id, link, source
            techmap   — keys: title, company, city, country, date_created, occupation, industry, work_place, work_type, career_level, portal, has_salary, is_duplicate
        columns:
          - name: raw_id
            description: UUID assigned at collection time — primary key.
          - name: run_id
            description: FK to collection_runs.run_id.
          - name: source_name
            description: Data source name — one of careerjet, tanqeeb, jooble, techmap.
          - name: source_job_id
            description: Native job ID from source. NULL for Careerjet (no native ID); populated for Tanqeeb and Jooble.
          - name: source_url
            description: Direct URL to the job posting on the source site.
          - name: raw_payload
            description: Full source response as Snowflake VARIANT. Schema varies by source_name (see table description).
          - name: collected_at
            description: ISO-8601 timestamp when the record was collected.

      - name: collection_runs
        description: One row per pipeline collection run.
        columns:
          - name: run_id
            description: UUID — primary key.
          - name: started_at
            description: ISO-8601 timestamp.
          - name: completed_at
            description: ISO-8601 timestamp.
          - name: source_name
            description: Data source name.
          - name: records_fetched
            description: Number of raw records written for this run.
          - name: notes
            description: Free-text notes about the run.
